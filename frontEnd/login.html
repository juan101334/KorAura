<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Acceso administración | KorAura</title>
  <link rel="icon" type="image/png" href="assets/images/logoPequeño.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="auth-page">
  <main class="auth">
    <a class="auth__back" href="index.html">← Volver a la tienda</a>

    <section class="auth__card" aria-labelledby="loginTitle">
      <img class="auth__logo" src="assets/images/logoPequeño.png" alt="KorAura" width="215" height="175">
      <h1 class="auth__title" id="loginTitle">Acceso administración</h1>
      <p class="auth__sub">Solo para el equipo de KorAura.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@koraura.com" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="pw__toggle" id="pwToggle" type="button" aria-pressed="false">Mostrar</button>
          </div>
        </div>

        <p class="form-error" id="loginError" role="alert" hidden></p>

        <button class="btn btn--primary btn--block" id="loginBtn" type="submit">Ingresar</button>
      </form>

      <div class="auth__notice" id="primerAdmin" hidden>
        <p>Todavía no hay ningún administrador registrado.</p>
        <a class="btn btn--ghost btn--block" href="registro.html">Crear cuenta de administrador</a>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="login.js"></script>
</body>
</html>
